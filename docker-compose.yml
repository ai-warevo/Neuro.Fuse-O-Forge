x-worker-base: &worker-base
  build:
    context: .
    dockerfile: ./backend/worker/Dockerfile
  volumes:
    - ./volumes/models:/app/models
    - ./volumes/output:/app/output
    - ./backend/config.yaml:/app/config.yaml
  environment:
    - REDIS_HOST=forge-redis
    - REDIS_PORT=6379
    - PYTHONPATH=/app
    - PYTHONUNBUFFERED=1
    - HF_HOME=/app/models/huggingface
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - forge-network

services:
  redis:
    image: redis:7-alpine
    container_name: forge-redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./volumes/redis:/data
    networks:
      - forge-network

  worker-sound:
    <<: *worker-base
    container_name: forge-worker-sound
    environment:
      - FORGE_TYPE=SOUND

networks:
  forge-network:
    driver: bridge
