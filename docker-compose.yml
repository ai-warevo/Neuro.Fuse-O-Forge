x-backend-common-env: &backend-common-env
  REDIS_HOST: forge-redis
  REDIS_PORT: 6379
  PYTHONPATH: /app
  PYTHONUNBUFFERED: 1

x-worker-common-env: &worker-common-env
  <<: *backend-common-env
  HF_HOME: /app/models/huggingface

x-worker-base: &worker-base
  image: ghcr.io/ai-warevo/forge-worker:latest
  build:
    context: .
    dockerfile: ./backend/worker/Dockerfile
  pull_policy: if_not_present
  restart: always
  healthcheck:
    test: >
      python3 -c "
      import redis, os;
      r = redis.Redis(
          host=os.getenv('REDIS_HOST'), 
          port=int(os.getenv('REDIS_PORT')), 
          decode_responses=True
      );
      exit(0 if r.get(f'forge:health:{os.getenv(\"FORGE_TYPE\")}') == 'online' else 1)
      "
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 30s
  volumes:
    - ./volumes/models:/app/models
    - ./volumes/output:/app/output
    - ./backend/config.yaml:/app/config.yaml
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  depends_on:
    forge-redis:
      condition: service_healthy
  networks:
    - forge-network

services:
  forge-redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    container_name: forge-redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    networks:
      - forge-network

  forge-api:
    image: ghcr.io/ai-warevo/forge-api:latest
    build:
      context: .
      dockerfile: ./backend/api/Dockerfile
    pull_policy: if_not_present
    restart: always
    container_name: forge-api
    ports:
      - "8000:8000"
    environment:
      - BASE_URL=http://localhost:8000
      - REDIS_HOST=forge-redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite+aiosqlite:////app/db/forge.db
      - PYTHONPATH=/app
    volumes:
      - ./volumes/output:/app/output
      - ./volumes/db:/app/db
      - ./backend/config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      forge-redis:
        condition: service_healthy
    networks:
      - forge-network

  forge-worker-sound:
    <<: *worker-base
    container_name: forge-worker-sound
    environment:
      <<: *worker-common-env
      FORGE_TYPE: SOUND

  forge-worker-text:
    <<: *worker-base
    container_name: forge-worker-text
    environment:
      <<: *worker-common-env
      FORGE_TYPE: TEXT

  forge-worker-ui:
    <<: *worker-base
    container_name: forge-worker-ui
    environment:
      <<: *worker-common-env
      FORGE_TYPE: UI

  forge-worker-image:
    <<: *worker-base
    container_name: forge-worker-image
    environment:
      <<: *worker-common-env
      FORGE_TYPE: IMAGE

  forge-ui:
    image: ghcr.io/ai-warevo/forge-ui:latest
    # build:
    #   context: .
    #   dockerfile: ./frontend/Dockerfile
    #   args:
    #     - NEXT_PUBLIC_API_URL=http://localhost:8000
    pull_policy: if_not_present
    restart: always
    container_name: forge-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      forge-api:
        condition: service_healthy
    networks:
      - forge-network

networks:
  forge-network:
    driver: bridge
